<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="AIEXX_GENAI_TEXT_TO_3D - Motor de Visualização 3D e Geração via IA">
    <meta name="keywords" content="3D, text-to-3d, AI, gerador, modelagem, AIEXX">
    <title>AIEXX_GENAI_TEXT_TO_3D - AI-Powered 3D Model Generator</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <!-- Neobrutalism Recommended Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Suprimir erros de extensões do navegador -->
    <script>
      // Capturar erros de extensões antes do app carregar
      window.addEventListener('error', function(e) {
        const message = e.message || '';
        if (
          message.includes('Extension context invalidated') ||
          message.includes('chrome-extension://') ||
          message.includes('moz-extension://')
        ) {
          e.preventDefault();
          e.stopPropagation();
          return false;
        }
      });

      // Suprimir erros de runtime.lastError
      if (typeof chrome !== 'undefined' && chrome.runtime) {
        const originalRuntime = chrome.runtime;
        Object.defineProperty(chrome, 'runtime', {
          get: function() {
            return new Proxy(originalRuntime, {
              get: function(target, prop) {
                if (prop === 'lastError') {
                  // Limpar lastError silenciosamente
                  return null;
                }
                return target[prop];
              }
            });
          }
        });
      }
    </script>
</head>
<body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
</body>
</html>
